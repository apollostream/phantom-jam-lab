<svg viewBox="0 0 760 390" role="img" aria-label="One driver who leaves room is enough near the bottom of the band; past it, five to ten are needed" xmlns="http://www.w3.org/2000/svg"><text x="24" y="30" fill="var(--ink)" font-size="16" font-weight="700">One driver in thirty is enough low in the band; nearer the theory line it takes five</text><text x="24" y="50" fill="var(--muted)" font-size="12.5">Fewest evenly spaced drivers who leave room that keep a ring of 30 smooth after a hard tap</text><rect x="86.71428571428574" y="84" width="299.1070594695489" height="246" fill="var(--amber)" opacity="0.22"/><text x="236.26781544906018" y="102" fill="var(--ink)" text-anchor="middle" font-size="12.5" font-weight="700">metastable band</text><rect x="385.82134518383464" y="84" width="314.17865481616536" height="246" fill="var(--red)" opacity="0.08"/><text x="542.9106725919173" y="102" fill="var(--ink)" text-anchor="middle" font-size="12.5" font-weight="700">past the theory line</text><line x1="64" x2="700" y1="330" y2="330" stroke="var(--grid)"/><text x="54" y="334" fill="var(--muted)" text-anchor="end" font-size="12">0</text><line x1="64" x2="700" y1="268.5" y2="268.5" stroke="var(--grid)"/><text x="54" y="272.5" fill="var(--muted)" text-anchor="end" font-size="12">3</text><line x1="64" x2="700" y1="207" y2="207" stroke="var(--grid)"/><text x="54" y="211" fill="var(--muted)" text-anchor="end" font-size="12">6</text><line x1="64" x2="700" y1="145.5" y2="145.5" stroke="var(--grid)"/><text x="54" y="149.5" fill="var(--muted)" text-anchor="end" font-size="12">9</text><line x1="64" x2="700" y1="84" y2="84" stroke="var(--grid)"/><text x="54" y="88" fill="var(--muted)" text-anchor="end" font-size="12">12</text><rect x="92.42857142857147" y="330" width="34" height="1.5" rx="4" fill="var(--blue)"><title>R = 0.8: 0 of 30 drivers must leave room (0%)</title></rect><text x="109.42857142857147" y="322" fill="var(--ink)" text-anchor="middle" font-size="12.5" font-weight="700">none</text>