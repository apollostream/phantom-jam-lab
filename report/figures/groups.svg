<svg viewBox="0 0 760 430" role="img" aria-label="The load number compares road needed with road available; the delay number compares reaction time with following time" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><text x="24" y="30" fill="var(--ink)" font-size="16" font-weight="700">Two ratios govern the ring</text><text x="24" y="50" fill="var(--muted)" font-size="12.5">The lab’s defaults: 30 cars, 900 m, 90 km/h, following time 1 s, reaction time 1 s</text><line x1="24" x2="736" y1="232" y2="232" stroke="var(--grid)"/><rect x="18" y="91" width="612" height="34" rx="6" fill="var(--road)"/><line x1="24" x2="624" y1="108" y2="108" stroke="var(--lane)" stroke-dasharray="10 9" stroke-width="1.2" opacity="0.6"/><rect x="109.71428571428571" y="95" width="38.095238095238095" height="26" rx="3" fill="var(--amber)" opacity="0.35"/><rect x="147.8095238095238" y="95" width="476.1904761904762" height="26" rx="3" fill="var(--green)" opacity="0.25"/><g><rect x="24" y="99" width="85.71428571428571" height="18" rx="5" fill="var(--green)"/><rect x="77.14285714285714" y="102" width="13.714285714285714" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><line x1="24" x2="109.71428571428571" y1="142" y2="142" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="66.85714285714286" y="159" fill="var(--ink)" text-anchor="middle" font-size="12.5">car 4.5 m</text><line x1="109.71428571428571" x2="147.8095238095238" y1="78" y2="78" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="128.76190476190476" y="71" fill="var(--ink)" text-anchor="middle" font-size="12.5">stopped gap 2 m</text><line x1="147.8095238095238" x2="624" y1="142" y2="142" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="385.9047619047619" y="159" fill="var(--ink)" text-anchor="middle" font-size="12.5">speed limit × following time = 25.0 m/s × 1 s = 25.0 m</text><text x="644" y="104" fill="var(--ink)" font-size="14" font-weight="700">31.5 m</text><text x="644" y="121" fill="var(--muted)" font-size="12.5">per car</text><text x="24" y="190" fill="var(--ink)" font-size="14" font-weight="700">Load number Λ = 30 cars × 31.5 m ÷ 900 m of road = 1.05</text><text x="24" y="209" fill="var(--muted)" font-size="12.5">Above 1, the cars cannot all fit at the speed limit and their following time.</text><line x1="50" x2="720" y1="316" y2="316" stroke="var(--axis)"/><line x1="80" x2="80" y1="312" y2="320" stroke="var(--axis)"/><text x="80" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">0 s</text><line x1="200" x2="200" y1="312" y2="320" stroke="var(--axis)"/><text x="200" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">1 s</text><line x1="320" x2="320" y1="312" y2="320" stroke="var(--axis)"/><text x="320" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">2 s</text><line x1="440" x2="440" y1="312" y2="320" stroke="var(--axis)"/><text x="440" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">3 s</text><line x1="560" x2="560" y1="312" y2="320" stroke="var(--axis)"/><text x="560" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">4 s</text><line x1="680" x2="680" y1="312" y2="320" stroke="var(--axis)"/><text x="680" y="336" fill="var(--muted)" text-anchor="middle" font-size="12">5 s</text><g><rect x="61" y="282" width="4" height="16" rx="1.5" fill="var(--red)"/><rect x="64" y="281" width="32" height="18" rx="5" fill="var(--amber)"/><rect x="83.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="184" y="281" width="32" height="18" rx="5" fill="var(--green)"/><rect x="203.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="304" y="281" width="32" height="18" rx="5" fill="var(--green)"/><rect x="323.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="424" y="281" width="32" height="18" rx="5" fill="var(--green)"/><rect x="443.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="544" y="281" width="32" height="18" rx="5" fill="var(--green)"/><rect x="563.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="664" y="281" width="32" height="18" rx="5" fill="var(--green)"/><rect x="683.84" y="284" width="5.12" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><line x1="80" x2="200" y1="264" y2="264" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="140" y="257" fill="var(--ink)" text-anchor="middle" font-size="12.5">following time T = 1 s per car</text><rect x="80" y="346" width="120" height="10" rx="5" fill="var(--red)" opacity="0.8"/><text x="210" y="355" fill="var(--ink)" font-size="12.5">reaction time τ = 1 s: the next car is already arriving</text><text x="24" y="390" fill="var(--ink)" font-size="14" font-weight="700">Delay number R = τ ÷ T = 1.0</text><text x="24" y="409" fill="var(--muted)" font-size="12.5">Above about 1.1 at this load, each driver passes on a slowdown larger than the one received.</text></svg>