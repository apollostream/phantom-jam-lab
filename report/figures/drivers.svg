<svg viewBox="0 0 760 268" role="img" aria-label="A tailgater copies the car ahead late; a driver who leaves room averages it out" xmlns="http://www.w3.org/2000/svg"><defs><marker id="fig-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--muted)"/></marker></defs><text x="24" y="30" fill="var(--ink)" font-size="16" font-weight="700">A tailgater copies the car ahead, late; a driver who leaves room averages it out</text><text x="24" y="84" fill="var(--red)" font-size="14" font-weight="700">Tailgater</text><text x="404" y="84" fill="var(--blue)" font-size="14" font-weight="700">Leaves ample room</text><rect x="24" y="115" width="336" height="34" rx="6" fill="var(--road)"/><line x1="30" x2="354" y1="132" y2="132" stroke="var(--lane)" stroke-dasharray="10 9" stroke-width="1.2" opacity="0.6"/><g><rect x="58" y="123" width="46" height="18" rx="5" fill="var(--green)"/><rect x="86.52" y="126" width="7.36" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="135" y="124" width="4" height="16" rx="1.5" fill="var(--red)"/><rect x="138" y="123" width="46" height="18" rx="5" fill="var(--amber)"/><rect x="166.52" y="126" width="7.36" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="215" y="124" width="4" height="16" rx="1.5" fill="var(--red)"/><rect x="218" y="123" width="46" height="18" rx="5" fill="var(--red)"/><rect x="246.52" y="126" width="7.36" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><line x1="108" x2="136" y1="102" y2="102" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="122" y="95" fill="var(--ink)" text-anchor="middle" font-size="12.5">1 s</text><text x="24" y="182" fill="var(--ink)" font-size="13">Acts on the gap and closing speed it saw</text><text x="24" y="200" fill="var(--ink)" font-size="13">a reaction time ago, then brakes a little</text><text x="24" y="218" fill="var(--ink)" font-size="13">harder than the car ahead did.</text><text x="24" y="244" fill="var(--muted)" font-size="12.5">Its following time: 1 second.</text><rect x="404" y="115" width="336" height="34" rx="6" fill="var(--road)"/><line x1="410" x2="734" y1="132" y2="132" stroke="var(--lane)" stroke-dasharray="10 9" stroke-width="1.2" opacity="0.6"/><rect x="480" y="119" width="132" height="26" rx="4" fill="var(--blue)" opacity="0.16"/><g><rect x="434" y="123" width="46" height="18" rx="5" fill="var(--green)" stroke="var(--blue)" stroke-width="2.5"/><rect x="462.52" y="126" width="7.36" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><g><rect x="609" y="124" width="4" height="16" rx="1.5" fill="var(--red)"/><rect x="612" y="123" width="46" height="18" rx="5" fill="var(--amber)"/><rect x="640.52" y="126" width="7.36" height="12" rx="2" fill="var(--paper)" opacity="0.55"/></g><line x1="484" x2="608" y1="102" y2="102" stroke="var(--muted)" stroke-width="1.25" marker-start="url(#fig-arrow)" marker-end="url(#fig-arrow)"/><text x="546" y="95" fill="var(--ink)" text-anchor="middle" font-size="12.5">3 s of room</text><text x="404" y="182" fill="var(--ink)" font-size="13">Cruises at the average speed of the car</text><text x="404" y="200" fill="var(--ink)" font-size="13">ahead over the last 8 seconds, and lets</text><text x="404" y="218" fill="var(--ink)" font-size="13">the gap shrink rather than braking.</text><text x="404" y="244" fill="var(--muted)" font-size="12.5">Corrects only when the gap leaves a wide band.</text><line x1="384" x2="384" y1="76" y2="258" stroke="var(--grid)"/></svg>